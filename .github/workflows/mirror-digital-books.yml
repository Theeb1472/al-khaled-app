name: Mirror AL KHALED digital books
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 0'
  push:
    paths:
      - '.github/workflows/mirror-digital-books.yml'

permissions:
  contents: write

concurrency:
  group: al-khaled-books-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout digital-library branch
        uses: actions/checkout@v4
        with:
          ref: digital-library
          fetch-depth: 1

      - name: Download and validate source files
        shell: bash
        env:
          LIBRARY_URL: https://hsobxezhcotkikbfoxqn.supabase.co/storage/v1/object/public/al-khaled-digital-library/
        run: |
          python3 - <<'PY'
          import gzip, hashlib, json, os, pathlib, time, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          root = pathlib.Path("books")
          root.mkdir(exist_ok=True)
          filenames = [
              "bukhari.json.gz", "muslim.json.gz", "abudawud.json.gz",
              "nasai.json.gz", "ibnmajah.json.gz", "tabari.json.gz",
              "ibnkathir.json.gz", "baghawi.json.gz", "mawardi.json.gz",
              "safwat.json.gz", "mokhtasar.json.gz",
          ]
          for start in range(1, 115, 12):
              end = min(start + 11, 114)
              filenames.append(f"qurtubi/{start}-{end}.json.gz")
          assert len(filenames) == 21
          base = os.environ["LIBRARY_URL"]
          def transfer(name):
              url = base + name
              req = urllib.request.Request(url, headers={"User-Agent":"AL-KHALED-library-backup/1.0"})
              with urllib.request.urlopen(req, timeout=90) as r:
                  if r.status != 200: raise RuntimeError(f"{name}: HTTP {r.status}")
                  data = r.read()
              if data[:2] != b"\x1f\x8b": raise RuntimeError(f"{name}: not gzip")
              unpacked = gzip.decompress(data) # checks gzip CRC
              parsed = json.loads(unpacked)
              if name.startswith("qurtubi/"):
                  if not isinstance(parsed, dict) or not parsed: raise ValueError(f"{name}: missing surah maps")
                  for key, rows in parsed.items():
                      if not key.isdigit() or not isinstance(rows, list): raise ValueError(f"{name}: bad surah structure")
              elif name in ("bukhari.json.gz","muslim.json.gz","abudawud.json.gz","nasai.json.gz","ibnmajah.json.gz"):
                  if not isinstance(parsed, dict) or not isinstance(parsed.get("hadiths"), list) or len(parsed["hadiths"]) < 1000:
                      raise ValueError(f"{name}: missing hadiths")
              else:
                  if not isinstance(parsed, dict) or not isinstance(parsed.get("ayahs"), list) or not parsed["ayahs"]:
                      raise ValueError(f"{name}: missing tafsir ayahs")
              path = root / name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              return {"path":name, "bytes":len(data), "sha256":hashlib.sha256(data).hexdigest()}
          # Fail the job if any single source is missing or corrupt; no partial commit.
          with ThreadPoolExecutor(max_workers=3) as pool:
              entries = sorted(pool.map(transfer, filenames), key=lambda x:x["path"])
          manifest = {
              "schema":1, "book_count":12, "files_count":len(entries),
              "source":"AL KHALED Supabase mirror of original data sources",
              "sources":{
                  "hadith":"https://github.com/fawazahmed0/hadith-api",
                  "quranpedia":"https://quranpedia.net",
                  "qurtubi":"https://github.com/spa5k/tafsir_api"
              }, "files":entries
          }
          (root / "manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          print("Validated", len(entries), "files, total", sum(x["bytes"] for x in entries), "bytes")
          PY

      - name: Commit backup to digital-library branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books/
          if git diff --cached --quiet; then
            echo "No changes to mirror."
          else
            git commit -m "Sync compressed hadith and tafsir JSON backup"
            git push origin HEAD:digital-library
          fi
